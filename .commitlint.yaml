min-version: v0.12.0
formatter: default
rules:
- header-max-length
- header-min-length
- footer-max-line-length
- type-enum

severity:
  default: error

settings:
  header-max-length:
    argument: 150
  header-min-length:
    argument: 10
  footer-max-line-length:
    argument: 100
  type-enum:
    argument:
    - feat
    - fix
    - docs
    - deps
    - style
    - refactor
    - perf
    - test
    - build
    - ci
    - chore
    - revert
    - wip
disable-default-ignores: false
ignores: []
